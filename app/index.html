<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="mypager">
<title>mypager</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='8' fill='%2315243a' stroke='%235aa2ff' stroke-width='1.8'/%3E%3Cpath d='M15 7v18M15 16h10' stroke='%235aa2ff' stroke-width='1.8' stroke-linecap='round'/%3E%3Cpath d='M7.5 10.5h4M7.5 14h4M7.5 17.5h3' stroke='%239cc6ff' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root{
    --bg:#0b0d10; --side:#0e1014; --panel:#121418; --raise:#191c22; --hover:#1c2027;
    --line:#22262d; --line2:#2e333c; --fg:#e6e8ec; --muted:#8b93a1; --faint:#5f6774;
    --accent:#5aa2ff; --accent2:#7db6ff; --accent-ink:#06101c; --sel:#18263a;
    --ok:#47c08a; --warn:#e2b04a; --bad:#ff6b6b;
    --side-w:272px; --top-h:50px;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--fg); overflow:hidden;
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  [hidden]{display:none !important}
  button,input,select{font:inherit;color:inherit}
  a{color:var(--accent2)}
  .ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
  .ib{display:inline-grid;place-items:center;width:32px;height:32px;padding:0;border:0;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;flex:none}
  .ib:hover{background:var(--hover);color:var(--fg)}
  .btn{height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line2);background:var(--raise);cursor:pointer;font-weight:550;white-space:nowrap}
  .btn:hover{border-color:#3b424d}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn.primary:hover{background:var(--accent2);border-color:var(--accent2)}
  .btn.danger{background:#3a1518;border-color:#5c2228;color:#ffb3b3}
  .btn.danger:hover{background:#4a1a1f}
  .btn:disabled{opacity:.6;cursor:default}
  .logo{width:28px;height:28px;flex:none}

  /* ---------- log in / sign up ---------- */
  #auth{
    position:fixed; inset:0; z-index:50; display:grid; place-items:center; padding:24px; overflow:auto;
    background:radial-gradient(1100px 560px at 50% -12%, #13233a 0%, var(--bg) 62%);
  }
  .card{
    width:min(372px,100%); display:flex; flex-direction:column; gap:12px; padding:28px;
    border:1px solid var(--line); border-radius:16px; background:rgba(17,19,23,.94);
    box-shadow:0 24px 70px rgba(0,0,0,.45);
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:20px;letter-spacing:-.01em}
  .card .sub{margin:-4px 0 4px;color:var(--muted)}
  .field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
  .field input{
    height:42px; padding:0 12px; border-radius:9px; border:1px solid var(--line2);
    background:var(--bg); color:var(--fg); font-size:16px; outline:none;
  }
  .field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(90,162,255,.18)}
  .field input[readonly]{color:var(--muted)}
  .err{min-height:18px;margin:0;color:var(--bad);font-size:13px}
  .note-box{margin:0;padding:10px 12px;border-radius:9px;background:var(--sel);color:#cfe2ff;font-size:13px}
  .alt{margin:0;text-align:center;font-size:13px}
  .link{color:var(--accent2);background:none;border:0;padding:0;cursor:pointer;font-size:13px;text-decoration:none}
  .link:hover{text-decoration:underline}
  .fine{margin:0;color:var(--faint);font-size:12px;line-height:1.5}

  /* ---------- shell ---------- */
  #app{display:flex;height:100%}
  #side{
    width:var(--side-w); flex:none; display:flex; flex-direction:column; min-height:0;
    background:var(--side); border-right:1px solid var(--line);
  }
  .side-top{display:flex;align-items:center;gap:2px;height:var(--top-h);padding:0 8px 0 14px;border-bottom:1px solid var(--line)}
  .side-top .brand{flex:1;font-size:15px;gap:9px;cursor:pointer;user-select:none}
  .side-top .logo{width:22px;height:22px}
  #tree{flex:1;overflow:auto;padding:6px 6px 16px}
  #tree.drop-root{background:rgba(90,162,255,.06)}
  .item{
    position:relative; display:flex; align-items:center; gap:7px; height:32px;
    padding:0 4px 0 calc(8px + var(--d,0) * 16px); border-radius:7px; cursor:pointer; user-select:none;
  }
  .item:hover{background:var(--hover)}
  .item.on{background:var(--sel)}
  .item.cwd{box-shadow:inset 2px 0 0 var(--accent)}
  .item.drop{background:var(--sel);box-shadow:inset 0 0 0 1px var(--accent)}
  .item .ic{width:16px;height:16px;color:var(--muted)}
  .item.on .ic{color:var(--accent2)}
  .item .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item.note .name.untitled{color:var(--muted)}
  .item time,.item .count{flex:none;color:var(--faint);font-size:11px}
  .item .more{width:24px;height:24px;opacity:0}
  .item .more .ic{width:15px;height:15px}
  .item:hover .more,.item.on .more{opacity:1}
  .item:hover time,.item.on time{display:none}
  .caret{display:grid;place-items:center;width:16px;height:16px;margin-left:-4px;padding:0;border:0;background:none;color:var(--faint);cursor:pointer}
  .caret .ic{width:12px;height:12px;transition:transform .12s}
  .caret.open .ic{transform:rotate(90deg)}
  .item input.rename{
    flex:1; min-width:0; height:24px; padding:0 6px; border-radius:5px; border:1px solid var(--accent);
    background:var(--bg); color:var(--fg); outline:none;
  }
  .tree-empty{padding:14px 10px;color:var(--faint);font-size:13px}
  .side-foot{display:flex;align-items:center;gap:6px;padding:8px 8px 10px 14px;border-top:1px solid var(--line)}
  .who{flex:1;min-width:0;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
  .who b{font-weight:550;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .avatar{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#1d2b40;color:var(--accent2);font-weight:700;font-size:12px;flex:none;text-transform:uppercase}
  .badge{min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:700;display:inline-grid;place-items:center}
  #scrim{display:none}

  #main{flex:1;min-width:0;display:flex;flex-direction:column}
  #top{display:flex;align-items:center;gap:6px;height:var(--top-h);padding:0 10px;border-bottom:1px solid var(--line)}
  #title{
    flex:1; min-width:0; height:34px; padding:0 8px; border:1px solid transparent; border-radius:8px;
    background:transparent; color:var(--fg); font-size:16px; font-weight:600; outline:none;
  }
  #title::placeholder{color:var(--faint)}
  #title:hover{border-color:var(--line)}
  #title:focus{border-color:var(--line2);background:var(--panel)}
  .spacer{flex:1}
  .status{display:flex;align-items:center;gap:6px;color:var(--faint);font-size:12px;white-space:nowrap;padding:0 4px}
  .status i{width:7px;height:7px;border-radius:50%;background:transparent}
  .status.saved i{background:var(--ok)}
  .status.saving i,.status.unsaved i,.status.loading i{background:var(--warn)}
  .status.offline i,.status.error i{background:var(--bad)}
  .status.offline,.status.error{color:#ffb3b3}

  /* ---------- toolbar ---------- */
  #bar{
    display:flex; align-items:center; gap:2px; padding:6px 8px; flex:none;
    border-bottom:1px solid var(--line); background:#0d0f13; overflow-x:auto; scrollbar-width:none; user-select:none;
  }
  #bar::-webkit-scrollbar{display:none}
  .grp{display:flex;align-items:center;gap:2px;padding:0 6px;border-right:1px solid var(--line);flex:none}
  .grp:first-child{padding-left:0}
  .grp:last-child{border-right:0}
  .t{
    display:inline-grid; place-items:center; height:30px; min-width:30px; padding:0 7px;
    border:1px solid transparent; border-radius:7px; background:transparent; color:var(--fg); cursor:pointer; font-size:13px;
  }
  .t .ic{width:17px;height:17px}
  .t:hover{background:var(--hover);border-color:var(--line)}
  .t.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  select.t{appearance:none;-webkit-appearance:none;padding:0 9px;background:var(--panel);border-color:var(--line)}
  .swatch{position:relative;display:grid;place-items:center;width:30px;height:30px;border-radius:7px;cursor:pointer}
  .swatch:hover{background:var(--hover)}
  .swatch span{width:16px;height:16px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.16)}
  .swatch input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}

  /* ---------- board ---------- */
  #root{flex:1;min-height:0;display:flex}
  .split{display:flex;flex:1;min-width:0;min-height:0}
  .split.row{flex-direction:row}
  .split.col{flex-direction:column}
  .pane{
    flex:1; min-width:0; min-height:0; position:relative; overflow:hidden;
    display:flex; flex-direction:column; background:var(--panel);
  }
  .pane.active{outline:2px solid var(--accent);outline-offset:-2px;z-index:1}
  /* size container: pictures size themselves against the pane, never the other way round */
  .pane .content{flex:1;min-height:0;position:relative;overflow:hidden;container-type:size}
  .pane .text{
    position:absolute; inset:0; padding:14px; outline:none; overflow:auto;
    line-height:1.55; font-size:16px; caret-color:var(--accent); overflow-wrap:anywhere;
  }
  .pane .text ul,.pane .text ol{padding-left:1.4em}
  .pane .text img{
    max-width:100%; max-height:calc(100cqh - 28px); width:auto; height:auto;
    vertical-align:bottom; border-radius:4px; cursor:grab;
  }
  /* pictures added here carry their ratio (--ar = w/h) and fill the pane as far as that ratio allows */
  .pane .text img[style*="--ar"]{
    width:min(calc(100cqw - 28px), calc((100cqh - 28px) * var(--ar)), 100%);
    max-width:none; max-height:none;
  }
  .pane .text img[data-pic]:not([src]){aspect-ratio:var(--ar,1.5);background:var(--raise)}
  .pane canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:none}
  .pane.draw canvas{display:block;cursor:crosshair}
  .pane.draw .text{pointer-events:none}
  .pane.dropping .text{pointer-events:auto}
  .pane.dropping canvas{pointer-events:none}
  .pane.dragging{opacity:.4}
  .pane.dragover{outline:2px dashed var(--accent);outline-offset:-2px}

  .pane .mini{position:absolute;top:6px;right:6px;z-index:5;display:flex;gap:3px;opacity:0;transition:opacity .15s}
  .pane:hover .mini,.pane.active .mini{opacity:1}
  .mini button{
    display:grid; place-items:center; width:26px; height:26px; padding:0; cursor:pointer;
    background:rgba(9,11,14,.74); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
    color:var(--fg); border:1px solid var(--line2); border-radius:7px;
  }
  .mini button .ic{width:14px;height:14px}
  .mini button:hover{border-color:#4a5360;background:#000}
  .mini .mv{cursor:grab}
  .mini .mv:active{cursor:grabbing}

  .gutter{position:relative;z-index:3;flex:0 0 5px;background:var(--line);touch-action:none}
  .gutter::after{content:"";position:absolute;inset:-3px}
  .gutter:hover,.gutter.on{background:var(--accent)}
  .split.row>.gutter{cursor:col-resize}
  .split.col>.gutter{cursor:row-resize}

  #dropCaret{position:fixed;z-index:40;width:2px;background:var(--accent);border-radius:1px;pointer-events:none;box-shadow:0 0 6px rgba(90,162,255,.8)}

  #empty{flex:1;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}
  #empty h2{margin:12px 0 4px;color:var(--fg);font-size:18px;font-weight:600}
  #empty p{margin:0 0 16px}
  #empty .logo{width:44px;height:44px;opacity:.9}
  #empty .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

  /* ---------- menus, dialogs, toast ---------- */
  .menu{
    position:fixed; z-index:60; min-width:200px; padding:5px; border:1px solid var(--line2); border-radius:11px;
    background:#15181d; box-shadow:0 14px 44px rgba(0,0,0,.5);
  }
  .menu button{
    display:flex; align-items:center; gap:10px; width:100%; height:33px; padding:0 10px;
    border:0; border-radius:7px; background:none; text-align:left; cursor:pointer; font-size:13px;
  }
  .menu button:hover{background:var(--hover)}
  .menu button .ic{width:16px;height:16px;color:var(--muted)}
  .menu button.danger,.menu button.danger .ic{color:var(--bad)}
  .menu hr{border:0;border-top:1px solid var(--line);margin:5px 3px}
  .modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.55)}
  .dialog{
    width:min(430px,100%); max-height:86vh; overflow:auto; display:flex; flex-direction:column; gap:12px; padding:22px;
    border:1px solid var(--line2); border-radius:15px; background:#14171c; box-shadow:0 26px 76px rgba(0,0,0,.55);
  }
  .dialog h3{margin:0;font-size:17px;font-weight:600}
  .dialog p{margin:0;color:var(--muted)}
  .dialog .acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:4px}
  .dialog .err{margin-top:-4px}
  .picker{max-height:300px;overflow:auto;padding:4px;border:1px solid var(--line);border-radius:10px}
  .picker .item.sel{background:var(--sel);box-shadow:inset 0 0 0 1px var(--accent)}
  #toast{
    position:fixed; left:50%; bottom:22px; z-index:80; max-width:min(560px,calc(100% - 32px));
    padding:10px 14px; border:1px solid var(--line2); border-radius:10px; background:#1a1e24; color:var(--fg);
    box-shadow:0 14px 44px rgba(0,0,0,.45); opacity:0; pointer-events:none;
    transform:translate(-50%,16px); transition:opacity .2s, transform .2s;
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}

  /* ---------- small screens: the list becomes a drawer ---------- */
  @media (max-width:760px){
    #side{position:fixed;left:0;top:0;bottom:0;z-index:30;width:min(86vw,320px);transform:translateX(-102%);transition:transform .2s ease;box-shadow:0 0 44px rgba(0,0,0,.55)}
    body.side-open #side{transform:none}
    #scrim{position:fixed;inset:0;z-index:29;background:rgba(0,0,0,.45)}
    body.side-open #scrim{display:block}
    .item{height:40px}
    .item .more{opacity:1}
    .item time{display:none}
    .item input.rename{font-size:16px}
    .status b{display:none}
    #title{font-size:16px}
  }
  @media (min-width:761px){
    body.side-closed #side{display:none}
  }
</style>
</head>

<script>
'use strict';
/* ==========================================================================
   mypager. Notes and multi-pane boards behind an ID + password.
   Everything is encrypted here, in the browser, before it is sent: the server
   (worker/worker.js) only ever stores ciphertext. See CLAUDE.md for the model.
   ========================================================================== */
const HOST = 'mypager.vaibhavpro9210.workers.dev';
const LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const LIVE = location.hostname === HOST || LOCAL;
// Copies of this file anywhere else (the repo is also on GitHub Pages) forward to the real one.
if (!LIVE) location.replace('https://' + HOST + '/' + location.hash);

/* ---------- small helpers ---------- */
const $ = s => document.querySelector(s);
const te = new TextEncoder(), td = new TextDecoder();
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'})[c]);
const icon = n => `<svg class="ic" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const elOf = n => n && (n.nodeType === 1 ? n : n.parentElement);
const IDRE = /^[A-Za-z0-9_-]{16,32}$/;
function b64u(u8) {
  let s = '';
  for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function unb64u(s) {
  const bin = atob(String(s).replace(/-/g, '+').replace(/_/g, '/'));
  const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
}
const unb64 = s => unb64u(String(s).replace(/\s+/g, '').replace(/=+$/, ''));
const rand = n => crypto.getRandomValues(new Uint8Array(n));
const newId = () => b64u(rand(12));
function cat(...parts) {
  const out = new Uint8Array(parts.reduce((n, p) => n + p.length, 0));
  let o = 0;
  for (const p of parts) { out.set(p, o); o += p.length; }
  return out;
}
function loadImage(src) {
  return new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => no(new Error('image')); im.src = src; });
}
function dataURLToBlob(s) {
  const m = /^data:([^;,]+)(;base64)?,(.*)$/s.exec(s);
  if (!m) return null;
  return new Blob([m[2] ? unb64(m[3]) : te.encode(decodeURIComponent(m[3]))], {type: m[1]});
}
function blobToDataURL(b) {
  return new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => no(r.error); r.readAsDataURL(b); });
}
function ago(t) {
  const s = (Date.now() - t) / 1000;
  if (s < 60) return 'now';
  if (s < 3600) return Math.floor(s / 60) + 'm';
  if (s < 86400) return Math.floor(s / 3600) + 'h';
  if (s < 7 * 86400) return Math.floor(s / 86400) + 'd';
  return new Date(t).toLocaleDateString([], {day: 'numeric', month: 'short'});
}
function readLS(k, fallback) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? fallback : v; } catch (e) { return fallback; } }
function download(name, data, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], {type}));
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}

/* ---------- state ---------- */
const S = {
  user: null, wrapped: null, dek: null, ready: false,
  pw: null,                       // the password, held only while just-logged-in imports try it
  folders: new Map(), notes: new Map(),
  labels: new Map(),              // ciphertext -> decrypted title / folder name
  open: null,                     // {id, rev, dirty, saving, gen, json, again, fails}
  cwd: null,                      // folder new notes go into (null = top level)
  collapsed: new Set(readLS('mp.collapsed', [])),
};

/* ---------- status, toast, menus, dialogs ---------- */
const STATUS = {saved: 'Saved', saving: 'Saving…', unsaved: 'Edited', loading: 'Opening…', offline: 'Offline, retrying', error: 'Not saved'};
function setStatus(k) {
  const el = $('#status');
  el.className = 'status ' + (k || '');
  el.querySelector('b').textContent = STATUS[k] || '';
  el.title = k === 'offline' ? "Can't reach the server. Your changes are kept here and saved when it's back." : '';
}
let toastT = null;
function toast(msg, ms = 4500) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms);
}

function popMenu(anchor, items) {
  const m = $('#menu');
  m.innerHTML = items.map((it, i) => it === '-' ? '<hr>'
    : `<button type="button" data-i="${i}" class="${it.danger ? 'danger' : ''}">${icon(it.icon)}<span>${esc(it.label)}</span></button>`).join('');
  m.hidden = false;
  const r = anchor.getBoundingClientRect(), mw = m.offsetWidth, mh = m.offsetHeight;
  let y = r.bottom + 4;
  if (y + mh > innerHeight - 8) y = Math.max(8, r.top - mh - 4);
  m.style.left = Math.max(8, Math.min(r.right - mw, innerWidth - mw - 8)) + 'px';
  m.style.top = y + 'px';
  m.onclick = e => { const b = e.target.closest('button'); if (!b) return; m.hidden = true; items[b.dataset.i].run(); };
}
document.addEventListener('pointerdown', e => {
  if (!$('#menu').hidden && !e.target.closest('#menu')) $('#menu').hidden = true;
}, true);

function modal(html, wire) {
  return new Promise(resolve => {
    const m = $('#modal'), d = m.querySelector('.dialog');
    d.innerHTML = html;
    m.hidden = false;
    let done = false;
    const onKey = e => { if (e.key === 'Escape') { e.preventDefault(); close(undefined); } };
    function close(v) {
      if (done) return;
      done = true; m.hidden = true; d.innerHTML = '';
      document.removeEventListener('keydown', onKey, true);
      resolve(v);
    }
    document.addEventListener('keydown', onKey, true);
    m.onpointerdown = e => { if (e.target === m) close(undefined); };
    wire(d, close);
    const f = d.querySelector('[autofocus]') || d.querySelector('input') || d.querySelector('.btn.primary,.btn.danger');
    if (f) f.focus();
  });
}
function confirmBox(title, text, ok, danger = true) {
  return modal(`<h3>${esc(title)}</h3><p>${esc(text)}</p>
    <div class="acts"><button class="btn" data-v="0">Cancel</button><button class="btn ${danger ? 'danger' : 'primary'}" data-v="1">${esc(ok)}</button></div>`,
  (d, close) => d.querySelectorAll('[data-v]').forEach(b => b.onclick = () => close(b.dataset.v === '1')));
}
// A small form in a dialog. submit(values) returns an error message, or nothing to close.
function formDialog({title, text, fields, ok, extra}) {
  return modal(`<h3>${esc(title)}</h3>${text ? `<p>${esc(text)}</p>` : ''}
    <form novalidate style="display:flex;flex-direction:column;gap:12px">
      ${fields.map(f => `<label class="field"><span>${esc(f.label)}</span><input name="${f.name}" type="${f.type || 'text'}"
        ${f.auto ? `autocomplete="${f.auto}"` : ''} ${f.numeric ? 'inputmode="numeric"' : ''} value="${esc(f.value || '')}" maxlength="${f.max || 200}"></label>`).join('')}
      <p class="err"></p>
      <div class="acts">${extra ? `<button type="button" class="link" data-x style="margin-right:auto">${esc(extra.label)}</button>` : ''}
        <button type="button" class="btn" data-cancel>${esc(fields.cancel || 'Cancel')}</button>
        <button type="submit" class="btn primary">${esc(ok.label)}</button></div>
    </form>`, (d, close) => {
    const form = d.querySelector('form'), err = d.querySelector('.err'), go = d.querySelector('[type=submit]');
    d.querySelector('[data-cancel]').onclick = () => close(undefined);
    if (extra) d.querySelector('[data-x]').onclick = () => close(extra.value);
    form.onsubmit = async e => {
      e.preventDefault();
      const v = Object.fromEntries(fields.map(f => [f.name, form.elements[f.name].value]));
      go.disabled = true; err.textContent = '';
      try { const msg = await ok.run(v); if (msg) err.textContent = msg; else close(v); }
      catch (x) { err.textContent = x.message || 'Something went wrong.'; }
      finally { go.disabled = false; }
    };
  });
}

/* ---------- server ---------- */
class ApiError extends Error { constructor(status, message, data) { super(message); this.status = status; this.data = data || {}; } }
let relogin = null;   // while the session is being renewed, failed calls wait here and retry
async function api(method, path, opt = {}) {
  for (let attempt = 0; ; attempt++) {
    const headers = {...(opt.headers || {})};
    let body = opt.body;
    if (opt.json !== undefined) { headers['Content-Type'] = 'application/json'; body = JSON.stringify(opt.json); }
    else if (body !== undefined) headers['Content-Type'] = 'application/octet-stream';
    let r;
    try { r = await fetch('/api/' + path, {method, headers, body, credentials: 'same-origin', cache: opt.cache || 'no-store'}); }
    catch (e) { throw new ApiError(0, "Can't reach mypager. Check your connection."); }
    if (r.status === 401 && S.ready && !opt.noRelogin && attempt === 0) { await needLogin(); continue; }
    if (!r.ok) {
      let d = {};
      try { d = await r.json(); } catch (e) { /* not json */ }
      throw new ApiError(r.status, d.error || 'Something went wrong (' + r.status + ').', d);
    }
    return r;
  }
}
const apiJSON = async (method, path, opt) => (await api(method, path, opt)).json();

/* ---------- crypto ----------
   password --PBKDF2 600k--> 32 bytes --HKDF--> auth (sent at login) + KEK (never leaves).
   The KEK unwraps the account's random data key (DEK); the DEK encrypts everything.
   Changing the password only re-wraps the DEK. */
const ITER = 600000;
async function deriveKeys(id, pw) {
  const base = await crypto.subtle.importKey('raw', te.encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name: 'PBKDF2', hash: 'SHA-256', salt: te.encode('mypager/v3/' + id), iterations: ITER}, base, 256);
  const hk = await crypto.subtle.importKey('raw', bits, 'HKDF', false, ['deriveBits', 'deriveKey']);
  const hkdf = info => ({name: 'HKDF', hash: 'SHA-256', salt: te.encode('mypager'), info: te.encode(info)});
  return {
    auth: b64u(new Uint8Array(await crypto.subtle.deriveBits(hkdf('auth'), hk, 256))),
    kek: await crypto.subtle.deriveKey(hkdf('wrap'), hk, {name: 'AES-GCM', length: 256}, false, ['wrapKey', 'unwrapKey']),
  };
}
async function wrapDek(dek, kek) {
  const iv = rand(12);
  return b64u(cat(iv, new Uint8Array(await crypto.subtle.wrapKey('raw', dek, kek, {name: 'AES-GCM', iv}))));
}
function unwrapDek(wrapped, kek, extractable = false) {
  const b = unb64u(wrapped);
  return crypto.subtle.unwrapKey('raw', b.subarray(12), kek, {name: 'AES-GCM', iv: b.subarray(0, 12)}, {name: 'AES-GCM'}, extractable, ['encrypt', 'decrypt']);
}
// aad binds each ciphertext to what it is ("note:<id>"), so the server can't swap them.
async function seal(bytes, aad) {
  const iv = rand(12);
  return cat(iv, new Uint8Array(await crypto.subtle.encrypt({name: 'AES-GCM', iv, additionalData: te.encode(aad)}, S.dek, bytes)));
}
async function unseal(u8, aad) {
  return new Uint8Array(await crypto.subtle.decrypt({name: 'AES-GCM', iv: u8.subarray(0, 12), additionalData: te.encode(aad)}, S.dek, u8.subarray(12)));
}
const sealText = async (s, aad) => b64u(await seal(te.encode(s), aad));
const unsealText = async (s, aad) => td.decode(await unseal(unb64u(s), aad));

/* The DEK is kept per device in IndexedDB as a non-extractable CryptoKey: scripts can use it
   but not read it out. Logging out deletes it. */
function idb() {
  return new Promise((ok, no) => {
    const r = indexedDB.open('mypager', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => ok(r.result);
    r.onerror = () => no(r.error);
  });
}
async function kv(mode, fn) {
  const db = await idb();
  return new Promise((ok, no) => {
    const tx = db.transaction('kv', mode), req = fn(tx.objectStore('kv'));
    tx.oncomplete = () => { db.close(); ok(req && req.result); };
    tx.onerror = tx.onabort = () => { db.close(); no(tx.error); };
  });
}
const keySave = (id, dek) => kv('readwrite', st => st.put({id, dek}, 'key')).catch(() => {});
const keyLoad = () => kv('readonly', st => st.get('key')).catch(() => null);
const keyDrop = () => kv('readwrite', st => st.delete('key')).catch(() => {});

/* ---------- note HTML hygiene ----------
   Applied to anything loaded into a pane and to pasted content: no scripts or frames, no
   event handlers, no ids or names (they would clobber the app's own lookups). */
const DROP_TAGS = 'script,style,iframe,frame,frameset,object,embed,link,meta,base,form,input,button,select,textarea,noscript,template,svg,math,canvas,video,audio,source,track';
function scrub(scope) {
  scope.querySelectorAll(DROP_TAGS).forEach(n => n.remove());
  scope.querySelectorAll('*').forEach(n => {
    for (const a of [...n.attributes]) {
      const name = a.name.toLowerCase(), v = a.value.replace(/[\u0000- ]+/g, '').toLowerCase();
      if (name.startsWith('on') || name === 'id' || name === 'name' || name === 'srcset' || name === 'srcdoc'
        || name === 'contenteditable' || name === 'formaction' || name.includes(':')) { n.removeAttribute(a.name); continue; }
      if (['href', 'src', 'background', 'action', 'poster'].includes(name) && v && !/^(https?:|mailto:|tel:|data:image\/|blob:|#)/.test(v))

/* ==========================================================================
   notes: open, autosave, conflicts
   Every save sends the rev it started from; if another device saved in between,

   ========================================================================== */
let saveT = null, loadSeq = 0;

  const o = S.open;

  if (o.saving) { o.again = true; return o.saving; }
  if (!o.dirty) return Promise.resolve(true);
  const gen = o.gen;
  o.saving = (async () => {
    try {
      await flushDrawings();
      const model = readModel(), json = JSON.stringify(model), pics = picsOf(model);
      await Promise.all(pics.filter(id => picQueue.has(id)).map(uploadPic));
      if (json !== o.json) {
        setStatus('saving');
        const body = await seal(te.encode(json), 'note:' + o.id);
        o.big = body.length > 300000;
        const r = await apiJSON('PUT', 'notes/' + o.id + '?rev=' + o.rev, {body, headers: {'X-Pics': pics.join(',')}});
        o.rev = r.rev; o.json = json;

      o.fails = 0;
      if (o.gen === gen) { o.dirty = false; setStatus('saved'); }

    } catch (e) {

      setStatus(e.status === 0 ? 'offline' : 'error');

    const ok = await (o.saving || save());
    if (!ok && S.open === o && o.dirty) break;
  }

    return false;
  }

}

    await createNote(newId(), label, meta.folder && S.folders.has(meta.folder) ? meta.folder : null, readModel());

  const title = await sealText(label, 'title:' + id);
  const headers = {'X-Title': title, 'X-Pics': pics.join(',')};

const parentOf = f => (f.parent && S.folders.has(f.parent) ? f.parent : null);
const folderOf = n => (n.folder && S.folders.has(n.folder) ? n.folder : null);
function notesUnder(fid) {

    grew = false;

        ${icon(open ? 'folder-open' : 'folder')}<span class="name">${esc(f.label || 'Folder')}</span>
        <span class="count">${c || ''}</span><button type="button" class="ib more" data-act="menu" title="Folder actions">${icon('more')}</button></div>`);

/* ==========================================================================
   imports: the old mypager board and the old Notepad
   A "carry" is an encrypted parcel on the server whose key arrives in the URL
   fragment (#carry=<id>.<key>). Inside is the old data, still locked with its
   old password, so this asks for that password unless it's the one just used.
   ========================================================================== */
const pendingCarries = () => readLS('mp.carries', []);
function setCarries(list) {
  localStorage.setItem('mp.carries', JSON.stringify(list));
  const n = list.length, b = $('#impBadge');
  b.hidden = !n; b.textContent = n;
}
const dropCarry = id => setCarries(pendingCarries().filter(c => c.id !== id));
const LATER = 'later', DISCARD = 'discard';
async function pbkdf2Key(pw, salt, iterations) {
  const base = await crypto.subtle.importKey('raw', te.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name: 'PBKDF2', salt, iterations, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
}
const LEGACY = {
  board: {
    title: 'Import your old board',
    text: 'The board this browser had in the old mypager is still locked with the password you used there. Enter it to bring the board in.',
    label: 'Old mypager password',
    // old app: PBKDF2-SHA256, fixed salt, 200k; blob = {iv, ct} in base64
    async open(blob, pw) {
      const o = JSON.parse(blob);
      const key = await pbkdf2Key(pw, te.encode('board.v2.fixed-salt'), 200000);
      return td.decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: unb64(o.iv)}, key, unb64(o.ct)));
    },
  },
  notepad: {
    title: 'Import your old Notepad',
    text: 'Your notes from the old Notepad app (Jan to Feb 2026, on GitHub) are locked with its 6-digit PIN. Enter it to bring them in.',
    label: 'Notepad PIN',
    numeric: true,
    // old app: base64(salt16 | iv12 | ct), PBKDF2-SHA256 100k over the PIN
    async open(blob, pw) {
      const u = unb64(blob);
      const key = await pbkdf2Key(pw, u.subarray(0, 16), 100000);
      const notes = JSON.parse(td.decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: u.subarray(16, 28)}, key, u.subarray(28))));
      if (!Array.isArray(notes)) throw new Error('not notepad data');
      return notes;
    },
  },
};
async function unlockLegacy(kind, blob, interactive) {
  const L = LEGACY[kind];
  if (S.pw) { try { return await L.open(blob, S.pw); } catch (e) { /* not this one */ } }
  if (!interactive) return LATER;
  let error = '';
  for (;;) {
    const ans = await formDialog({
      title: L.title, text: L.text,
      fields: [{name: 'pw', label: L.label, type: 'password', auto: 'off', numeric: L.numeric}],
      ok: {label: 'Import', run: v => (v.pw ? '' : 'Enter it first.')},
      extra: {label: "Don't import it", value: DISCARD},
    }).then(v => v, () => undefined);
    if (ans === DISCARD) {
      if (await confirmBox('Skip this import for good?', "It won't be offered again on this device. The old copy itself isn't touched.", 'Skip it')) return DISCARD;
      continue;
    }
    if (!ans) return LATER;
    try { return await L.open(blob, ans.pw); }
    catch (e) { error = kind === 'notepad' ? "That PIN doesn't open it." : "That password doesn't open it."; toast(error); }
  }
}
// The old board was saved as the HTML of its pane tree; rebuild it as a note.
async function modelFromOldBoard(html) {
  const doc = new DOMParser().parseFromString('<div id="r">' + html + '</div>', 'text/html');
  const isNode = e => e.classList && (e.classList.contains('split') || e.classList.contains('pane'));
  let anything = false;
  const walk = async e => {
    if (e.classList.contains('split')) {
      const kids = [];
      for (const c of [...e.children].filter(isNode)) kids.push(await walk(c));
      return {t: 'split', dir: e.classList.contains('col') ? 'col' : 'row', flex: e.style.flex || '1 1 0', kids};
    }
    const holder = document.createElement('div'), t = e.querySelector('.text'), cv = e.querySelector('canvas');
    holder.innerHTML = clean(t ? t.innerHTML : '');
    await adoptDataImages(holder);
    const n = {t: 'pane', mode: e.classList.contains('draw') ? 'draw' : 'text', flex: e.style.flex || '1 1 0', html: storedHTML(holder)};
    const src = cv && cv.getAttribute('data-img');
    if (src && /^data:image\/png;base64,/.test(src)) Object.assign(n, await drawingFrom(src));
    if (holder.textContent.trim() || holder.querySelector('img') || n.draw) anything = true;
    return n;
  };
  const tops = [...doc.getElementById('r').children].filter(isNode);
  if (!tops.length) return null;
  let node;
  if (tops.length === 1) node = await walk(tops[0]);
  else { const kids = []; for (const t of tops) kids.push(await walk(t)); node = {t: 'split', dir: 'row', flex: '1 1 0', kids}; }
  return anything ? {v: 1, root: normalizeNode(node)} : null;
}
// The old app saved every canvas, drawn on or not: skip blank ones.
async function drawingFrom(src) {
  const im = await loadImage(src), w = im.naturalWidth, h = im.naturalHeight;
  if (!w || !h) return {};
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  ctx.drawImage(im, 0, 0);
  const d = ctx.getImageData(0, 0, w, h).data;
  let ink = false;
  for (let i = 3; i < d.length && !ink; i += 4) if (d[i]) ink = true;
  if (!ink) return {};
  const id = newId();
  picQueue.set(id, {blob: dataURLToBlob(src), p: null});
  await uploadPic(id);
  return {draw: id, dw: w, dh: h};
}
async function importBoard(html, title) {
  const model = await modelFromOldBoard(html);
  return model ? createNote(newId(), title, null, model) : null;
}
async function importNotepad(notes) {
  const good = notes.filter(n => n && typeof n.content === 'string' && n.content.trim());
  if (!good.length) { toast('The old Notepad had no notes in it.'); return []; }
  const fid = newId(), name = await sealText('Notepad', 'folder:' + fid);
  const r = await apiJSON('POST', 'folders', {json: {id: fid, parent: null, name}});
  S.labels.set(name, 'Notepad');
  S.folders.set(fid, {id: fid, parent: null, name, label: 'Notepad', created: r.created, updated: r.created});
  const out = [];
  for (const n of good) {
    const lines = n.content.replace(/\r\n?/g, '\n').split('\n');
    const html = lines.map(l => l.trim()
      ? '<div>' + esc(l).replace(/\t/g, '    ').replace(/ {2}/g, ' &nbsp;') + '</div>' : '<div><br></div>').join('');
    const title = (lines.find(l => l.trim()) || n.title || 'Untitled').trim().slice(0, 80);
    out.push(await createNote(newId(), title, fid, {v: 1, root: {t: 'pane', mode: 'text', flex: '1 1 0', html}},
      {created: Date.parse(n.createdAt) || 0, updated: Date.parse(n.updatedAt) || 0}));
  }
  return out;
}
// -> list of created notes, or LATER
async function importPayload(p, interactive) {
  if (!p || typeof p !== 'object') return [];
  if (typeof p.notepad === 'string') {
    const notes = await unlockLegacy('notepad', p.notepad, interactive);
    if (notes === LATER) return LATER;
    return notes === DISCARD ? [] : importNotepad(notes);
  }
  if (typeof p.board !== 'string' && typeof p.boardPlain !== 'string') return [];
  let html = null;
  if (typeof p.board === 'string') {
    html = await unlockLegacy('board', p.board, interactive);
    if (html === LATER) return LATER;
    if (html === DISCARD) html = null;
  }
  const from = p.label ? ' (' + String(p.label).slice(0, 40) + ')' : '';
  const out = [];
  if (html !== null) { const m = await importBoard(html, 'Old board' + from); if (m) out.push(m); }
  if (typeof p.boardPlain === 'string' && p.boardPlain !== html) {
    const m = await importBoard(p.boardPlain, 'Old board, unencrypted copy' + from);
    if (m) out.push(m);
  }
  if (!out.length && html !== null) toast('The old board from that browser was empty, so there was nothing to bring in.');
  return out;
}
let importing = false;
async function runImports(interactive) {
  if (importing) return;
  importing = true;
  let made = [];
  try {
    for (const c of pendingCarries()) {
      let payload;
      try {
        const r = await api('GET', 'carry/' + c.id);
        const key = await crypto.subtle.importKey('raw', unb64u(c.k), 'AES-GCM', false, ['decrypt']);
        const u = new Uint8Array(await r.arrayBuffer());
        payload = JSON.parse(td.decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: u.subarray(0, 12)}, key, u.subarray(12))));
      } catch (e) {
        if (e.status === 0) return;   // offline: keep everything for later
        dropCarry(c.id);
        toast(e.status === 404 ? 'An import link had already been used or had expired.' : "One import couldn't be opened, so it was skipped.");
        continue;
      }
      try {
        const res = await importPayload(payload, interactive);
        if (res === LATER) continue;
        made = made.concat(res);
      } catch (e) { toast('Import stopped: ' + e.message + ' It will be offered again.'); continue; }
      api('DELETE', 'carry/' + c.id).catch(() => {});
      dropCarry(c.id);
    }
  } finally {
    importing = false;
    setCarries(pendingCarries());
    if (made.length) {
      renderTree();
      toast('Imported ' + made.length + (made.length === 1 ? ' note.' : ' notes.'), 6000);
      if (!S.open) openNote(made[0].id);
    }
  }
}

  } catch (x) { toast('Import failed: ' + x.message); }
};

/* ==========================================================================
   export: read-only HTML snapshots (pictures inlined), opens anywhere
   ========================================================================== */
async function staticBoard(model) {
  const node = async n => {
    if (n.t === 'split') {
      const kids = [];
      for (const k of n.kids) kids.push(await node(k));
      return `<div class="s ${n.dir === 'col' ? 'c' : 'r'}" style="flex:${esc(n.flex || '1 1 0')}">${kids.join('<i></i>')}</div>`;
    }
    const t = document.createElement('template');
    t.innerHTML = clean(n.html);
    for (const img of [...t.content.querySelectorAll('img[data-pic]')]) {
      try { img.src = await picDataURL(img.dataset.pic); img.removeAttribute('data-pic'); } catch (e) { img.remove(); }
    }
    let draw = '';
    if (n.draw) { try { draw = `<img class="d" alt="" src="${await picDataURL(n.draw)}" style="width:${+n.dw || 0}px">`; } catch (e) { /* skip */ } }
    return `<div class="p" style="flex:${esc(n.flex || '1 1 0')}"><div class="t">${t.innerHTML}</div>${draw}</div>`;
  };
  return node(normalizeNode(model.root));
}
function folderPath(fid) {
  const out = [];
  for (let f = fid && S.folders.get(fid), i = 0; f && i < 50; f = S.folders.get(parentOf(f)), i++) out.unshift(f.label);
  return out.join(' / ');
}

<title>${esc(title)}</title><style>

  } catch (e) { toast('Export failed: ' + e.message); }
}

/* ==========================================================================
   log in, sign up, unlock, password changes
   ========================================================================== */
const auth = {mode: 'login', invite: ''};
const AUTH_TEXT = {
  login: {sub: 'Log in to your notes.', go: 'Log in', swap: 'Create an account'},
  signup: {sub: 'Create your account.', go: 'Create account', swap: 'I already have an account'},
  unlock: {sub: 'Welcome back. Enter your password to unlock your notes on this device.', go: 'Unlock', swap: 'Log out'},
  relogin: {sub: 'Your session ended. Log in again to carry on; nothing on screen is lost.', go: 'Log in', swap: 'Log out'},
};
function showAuth(mode, opts = {}) {
  auth.mode = mode;
  const T = AUTH_TEXT[mode];
  $('#auth').hidden = false;
  $('#authSub').textContent = T.sub;
  $('#authGo').textContent = T.go;
  $('#authSwap').textContent = T.swap;
  $('#fPw2').hidden = $('#fInv').hidden = mode !== 'signup';
  $('#authFine').hidden = mode !== 'signup';
  $('#aId').readOnly = mode === 'unlock' || mode === 'relogin';
  $('#aPw').autocomplete = mode === 'signup' ? 'new-password' : 'current-password';
  if (opts.id !== undefined) $('#aId').value = opts.id;
  $('#aPw').value = ''; $('#aPw2').value = '';
  if (mode === 'signup' && auth.invite) $('#aInv').value = auth.invite;
  $('#authErr').textContent = opts.error || '';
  const n = pendingCarries().length;
  $('#authNote').hidden = !n || mode === 'relogin';
  $('#authNote').textContent = 'Once you are in, mypager will import ' + (n === 1 ? 'the old notes you brought over.' : n + ' bundles of old notes.');
  ($('#aId').value && !$('#aId').readOnly ? $('#aPw') : $('#aId').readOnly ? $('#aPw') : $('#aId')).focus();
}
$('#authSwap').onclick = () => {
  if (auth.mode === 'login') return showAuth('signup', {});
  if (auth.mode === 'signup') return showAuth('login', {});
  logout();
};
$('#authForm').addEventListener('submit', async e => {
  e.preventDefault();
  const go = $('#authGo'), err = $('#authErr');
  if (go.disabled) return;
  const id = $('#aId').value.trim().toLowerCase(), pw = $('#aPw').value, mode = auth.mode;
  err.textContent = '';
  if (!/^[a-z0-9][a-z0-9._-]{2,31}$/.test(id)) { err.textContent = 'IDs are 3 to 32 characters: letters, digits, dot, dash or underscore.'; return; }
  if (!pw) { err.textContent = 'Enter your password.'; return; }
  if (mode === 'signup') {
    if (pw.length < 8) { err.textContent = 'Use at least 8 characters.'; return; }
    if (pw !== $('#aPw2').value) { err.textContent = "The two passwords don't match."; return; }
    if (!$('#aInv').value.trim()) { err.textContent = 'Enter the invite code.'; return; }
  }
  go.disabled = true;
  const label = go.textContent;
  go.textContent = mode === 'signup' ? 'Creating…' : 'Unlocking…';
  try {
    const keys = await deriveKeys(id, pw);
    let wrapped;
    if (mode === 'signup') {
      const dek = await crypto.subtle.generateKey({name: 'AES-GCM', length: 256}, true, ['encrypt', 'decrypt']);
      wrapped = await wrapDek(dek, keys.kek);
      await apiJSON('POST', 'signup', {json: {id, auth: keys.auth, wrapped, invite: $('#aInv').value.trim()}, noRelogin: true});
    } else if (mode === 'unlock') {
      wrapped = S.wrapped;
    } else {
      wrapped = (await apiJSON('POST', 'login', {json: {id, auth: keys.auth}, noRelogin: true})).wrapped;
    }
    let dek;
    try { dek = await unwrapDek(wrapped, keys.kek); }
    catch (x) { err.textContent = mode === 'unlock' ? 'Wrong password.' : "Couldn't open your key."; return; }
    if (S.user && S.user !== id) { location.reload(); return; }
    S.user = id; S.wrapped = wrapped; S.dek = dek; S.pw = pw;
    localStorage.setItem('mp.id', id);
    keySave(id, dek);
    $('#auth').hidden = true;
    $('#aPw').value = ''; $('#aPw2').value = '';
    if (mode === 'relogin' && relogin) { const r = relogin; relogin = null; S.pw = null; r.resolve(); return; }
    await enterApp();
  } catch (x) {
    err.textContent = x.message || 'Something went wrong.';
  } finally {
    go.disabled = false; go.textContent = label;
  }
});
function needLogin() {
  if (!relogin) {
    let resolve;
    const p = new Promise(r => { resolve = r; });
    relogin = {p, resolve};
    showAuth('relogin', {id: S.user || localStorage.getItem('mp.id') || ''});
  }
  return relogin.p;
}
async function logout() {
  if (S.open && S.open.dirty) await flush();
  try { await api('POST', 'logout', {noRelogin: true}); } catch (e) { /* offline: the cookie still goes */ }
  await keyDrop();
  location.replace(location.pathname);
}
function changePassword() {
  return formDialog({
    title: 'Change password',
    text: 'Your notes stay as they are; only the lock on your key changes. Other devices will ask for the new password.',
    fields: [
      {name: 'cur', label: 'Current password', type: 'password', auto: 'current-password'},
      {name: 'n1', label: 'New password', type: 'password', auto: 'new-password'},
      {name: 'n2', label: 'New password again', type: 'password', auto: 'new-password'},
    ],
    ok: {label: 'Change password', run: async v => {
      if (v.n1.length < 8) return 'Use at least 8 characters.';
      if (v.n1 !== v.n2) return "The new passwords don't match.";
      const me = await apiJSON('GET', 'me');
      const old = await deriveKeys(S.user, v.cur);
      let dek;
      try { dek = await unwrapDek(me.wrapped, old.kek, true); } catch (e) { return 'Current password is wrong.'; }
      const next = await deriveKeys(S.user, v.n1);
      const wrapped = await wrapDek(dek, next.kek);
      try { await api('POST', 'password', {json: {auth: old.auth, newAuth: next.auth, wrapped}}); }
      catch (e) { return e.message; }
      S.wrapped = wrapped;
      toast('Password changed. Other devices will ask for the new one.');
      return '';
    }},
  });
}

/* ==========================================================================
   boot
   ========================================================================== */
async function enterApp() {
  $('#who').textContent = S.user;
  $('#avatar').textContent = S.user[0];
  $('#app').hidden = false;
  S.ready = true;
  setCarries(pendingCarries());
  try { await refreshTree(); } catch (e) { toast(e.message); }
  const last = localStorage.getItem('mp.last');
  const recent = [...S.notes.values()].sort((a, b) => b.updated - a.updated)[0];
  const pick = S.notes.has(last) ? last : recent && recent.id;
  if (pick) await loadNote(pick); else showEmpty();
  if (pendingCarries().length) await runImports(!!(S.pw || S.freshCarry));
  S.pw = null; S.freshCarry = false;
}
let lastRefresh = 0;
async function refreshFromServer() {
  if (!S.ready || !$('#auth').hidden || Date.now() - lastRefresh < 4000) return;
  lastRefresh = Date.now();
  try { await refreshTree(); } catch (e) { return; }
  const o = S.open;
  if (!o) return;
  const m = S.notes.get(o.id);
  if (!m) { if (!o.dirty && !o.saving) { showEmpty(); toast('That note was deleted on another device.'); } return; }
  if (document.activeElement !== $('#title') && !titleT) $('#title').value = m.label || '';
  if (m.rev > o.rev && !o.dirty && !o.saving) loadNote(o.id);   // newer version from another device
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (S.open && S.open.dirty) save(); }
  else refreshFromServer();
});
window.addEventListener('focus', refreshFromServer);
window.addEventListener('beforeunload', e => {
  const o = S.open;
  if (o && (o.dirty || o.saving || titleT)) { save(); if (titleT) saveTitle(); e.preventDefault(); e.returnValue = ''; }
});
window.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') {
    e.preventDefault();
    if (S.open) { if (titleT) saveTitle(); if (S.open.dirty) save(); else setStatus('saved'); }
  }
  if (e.key === 'Escape') $('#menu').hidden = true;
});

// #invite=<code>&carry=<id>.<key>[,<id>.<key>] : read, remember, and take out of the address bar.
// True if it brought new imports.
function readFragment() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('invite')) auth.invite = h.get('invite');
  const fresh = (h.get('carry') || '').split(',').map(x => x.split('.'))
    .filter(([id, k]) => IDRE.test(id || '') && /^[A-Za-z0-9_-]{43}$/.test(k || ''));
  const list = pendingCarries();
  let added = false;
  for (const [id, k] of fresh) if (!list.some(c => c.id === id)) { list.push({id, k, at: Date.now()}); added = true; }
  if (added) setCarries(list);
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  return added;
}
// An import link opened in a tab where mypager is already running only changes the fragment.
window.addEventListener('hashchange', () => { if (readFragment() && S.ready && S.dek) runImports(true); });

async function boot() {
  S.freshCarry = readFragment();
  let me = null;
  try { me = await apiJSON('GET', 'me', {noRelogin: true}); }
  catch (e) {
    if (e.status !== 401) { showAuth('login', {id: localStorage.getItem('mp.id') || '', error: e.message}); return; }
  }
  if (me) {
    S.user = me.id; S.wrapped = me.wrapped;
    const k = await keyLoad();
    if (k && k.id === me.id && k.dek) { S.dek = k.dek; return enterApp(); }
    return showAuth('unlock', {id: me.id});
  }
  showAuth(auth.invite ? 'signup' : 'login', {id: localStorage.getItem('mp.id') || ''});
}
if (LIVE) boot();
</script>

<script>
/* anonymous visit beacon (site-analytics): counts loads + presence heartbeats, no cookies */
(function(){
  if (location.protocol === "file:" || /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) return;
  var EP = "https://site-analytics.vaibhavpro9210.workers.dev/ping";
  var sid = sessionStorage.getItem("va_sid");
  if (!sid) { sid = Math.random().toString(36).slice(2) + Date.now().toString(36); sessionStorage.setItem("va_sid", sid); }
  /* served at the root of workers.dev: prefix the path so it doesn't collide with the portfolio homepage */
  var pg = "/mypager" + location.pathname;
  function send(kind){
    try { navigator.sendBeacon(EP, new Blob([JSON.stringify({sid:sid, page:pg, kind:kind})], {type:"text/plain"})); } catch(e){}
  }
  send("load");
  setInterval(function(){ if (document.visibilityState === "visible") send("beat"); }, 60000);
})();
</script>
